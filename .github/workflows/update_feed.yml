name: Update SAP SCM customer-story feed

# Runs daily at 09:23 Asia/Shanghai (01:23 UTC), and can be triggered manually.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch: {}

# Needed so the workflow can commit the refreshed feed back to the repo.
permissions:
  contents: write

concurrency:
  group: update-sap-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build RSS feed (stdlib only, fetches SAP Solr endpoint)
        run: python sap_scm_feed.py feed/sap_scm_customer_stories.xml

      - name: Commit refreshed feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --staged --quiet; then
            echo "No new stories; nothing to commit."
          else
            git commit -m "chore: refresh SAP SCM feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
